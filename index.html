<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="dark">
<title>Forêt ventriloque</title>
<style>
  :root {
    --moss: #14201a;
    --moss-2: #1d2e24;
    --lichen: #b5c48f;
    --fog: #e7ebdf;
    --bark: #8a735c;
    box-sizing: border-box;
    padding-top: env(safe-area-inset-top, 0px);
    padding-bottom: env(safe-area-inset-bottom, 0px);
  }
  *, *::before, *::after { box-sizing: inherit; }
  html, body { height: 100%; margin: 0; }
  body {
    background: radial-gradient(ellipse at 50% 38%, var(--moss-2), var(--moss) 70%);
    color: var(--fog);
    font-family: "Iowan Old Style", "Palatino Linotype", Palatino, Georgia, serif;
    line-height: 1.6;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    text-align: center;
    padding: 1.5rem;
  }
  main { width: 100%; max-width: 26rem; }
  h1 {
    font-weight: 400;
    font-size: clamp(2.2rem, 10vw, 3.2rem);
    line-height: 1.05;
    letter-spacing: -0.01em;
    margin: 0 0 2.5rem;
  }
  .voice { position: relative; width: 12rem; height: 12rem; margin: 0 auto 2rem; }
  .voice i {
    position: absolute; inset: 0; border-radius: 50%;
    border: 1px solid var(--lichen); opacity: .0;
  }
  .voice.on i { animation: ring 3.6s ease-out infinite; }
  .voice.on i:nth-child(2) { animation-delay: 1.2s; }
  .voice.on i:nth-child(3) { animation-delay: 2.4s; }
  @keyframes ring { from { transform: scale(.45); opacity: .7; } to { transform: scale(1.35); opacity: 0; } }
  button {
    position: absolute; inset: 2.6rem;
    width: auto; height: auto;
    border-radius: 50%;
    border: 1px solid var(--lichen);
    background: transparent; color: var(--fog);
    font: inherit; font-size: 1rem; cursor: pointer;
  }
  button:hover:not(:disabled) { background: rgba(181,196,143,.12); }
  button:focus-visible { outline: 2px solid var(--lichen); outline-offset: 4px; }
  button:disabled { border-color: var(--bark); color: var(--bark); cursor: default; }
  #msg { font-size: 1.15rem; margin: 0 0 .5rem; min-height: 3.4em; }
  #detail { font-size: .95rem; color: var(--bark); margin: 0; min-height: 1.6em; }
  @media (prefers-reduced-motion: reduce) { .voice.on i { animation: none; opacity: .35; } }
</style>
</head>
<body>
<main>
  <h1>Forêt ventriloque</h1>
  <div class="voice" id="voice"><i></i><i></i><i></i>
    <button id="btn" type="button">Commencer</button>
  </div>
  <p id="msg" aria-live="polite">Touchez le bouton pour activer votre position. La voix se fait entendre quand vous marchez dans la forêt.</p>
  <p id="detail"></p>
</main>

<script>
// ---- Réglages ----
// Chaque zone : un point GPS, un rayon (m) et un fichier son. Le son se lance à l'entrée dans la zone.
// Si des zones se chevauchent, la plus petite l'emporte.
const ZONES = [
  { id: "foret", name: "Forêt ventriloque", lat: 46.528250, lon: 6.610889, radius: 10, src: "foret-ventriloque.mp4" }, // 46°31'41.7"N 6°36'39.2"E
  { id: "zone2", name: "Zone 2", lat: 46.528389, lon: 6.610528, radius: 10, src: "zone2.mp4" },  // 46°31'42.2"N 6°36'37.9"E
  { id: "zone3", name: "Zone 3", lat: 46.528111, lon: 6.611194, radius: 10, src: "zone3.mp4" }   // 46°31'41.2"N 6°36'40.3"E
];
const WALK_CONTROLS = true; // true : le son ne joue qu'en marchant, et la vitesse de marche règle la lecture
const MIN_SPEED = 0.6;      // m/s : en dessous, la personne est à l'arrêt
const REF_SPEED = 1.3;      // m/s : allure normale = lecture à vitesse 1
const MIN_RATE = 0.6, MAX_RATE = 1.5;
const STOP_DELAY = 3000;    // ms d'arrêt avant la pause
const EXIT_MARGIN = 5;      // m : marge à la sortie d'une zone, pour éviter les coupures dues au GPS
// -------------------

const $ = id => document.getElementById(id);
const btn = $("btn"), msg = $("msg"), detail = $("detail"), voice = $("voice");
let started = false, active = null, smooth = 0, lastPos = null, lastMove = 0, fixed = false;
const finished = new Set();

// Un lecteur par zone, préchargé : le passage d'une zone à l'autre est immédiat
ZONES.forEach(z => {
  z.audio = new Audio(z.src);
  z.audio.preload = "auto";
  z.audio.preservesPitch = true;
  z.audio.addEventListener("ended", () => { finished.add(z.id); apply(); });
});

function distanceM(lat1, lon1, lat2, lon2) {
  const R = 6371000, rad = Math.PI / 180;
  const dLat = (lat2 - lat1) * rad, dLon = (lon2 - lon1) * rad;
  const a = Math.sin(dLat / 2) ** 2 +
            Math.cos(lat1 * rad) * Math.cos(lat2 * rad) * Math.sin(dLon / 2) ** 2;
  return 2 * R * Math.asin(Math.sqrt(a));
}
const fmt = d => d >= 1000 ? (d / 1000).toFixed(1).replace(".", ",") + " km" : Math.round(d) + " m";

btn.addEventListener("click", () => {
  if (started) return;
  if (!("geolocation" in navigator)) { msg.textContent = "Ce navigateur ne permet pas d’utiliser la position."; return; }
  started = true;
  btn.disabled = true;
  btn.textContent = "…";
  msg.textContent = "Recherche de votre position…";
  // Ce premier geste débloque la lecture automatique de tous les sons
  ZONES.forEach(z => {
    z.audio.muted = true;
    z.audio.play().then(() => { z.audio.pause(); z.audio.currentTime = 0; z.audio.muted = false; })
                  .catch(() => { z.audio.muted = false; });
  });
  try { navigator.wakeLock && navigator.wakeLock.request("screen").catch(() => {}); } catch (e) {}
  navigator.geolocation.watchPosition(onPos, onErr, { enableHighAccuracy: true, maximumAge: 2000, timeout: 20000 });
  setInterval(tick, 1000);
});

function onPos(p) {
  const { latitude: la, longitude: lo, accuracy, speed } = p.coords;
  fixed = true;
  ZONES.forEach(z => { z.d = distanceM(la, lo, z.lat, z.lon); });

  // Choix de la zone : la plus petite zone contenant la position, avec marge à la sortie
  let best = null;
  ZONES.forEach(z => { if (z.d <= z.radius && (!best || z.radius < best.radius)) best = z; });
  if (!best && active && active.d <= active.radius + EXIT_MARGIN) best = active;
  if (best !== active) {
    if (active) { active.audio.pause(); active.audio.currentTime = 0; }
    active = best;
    if (active) { finished.delete(active.id); active.audio.currentTime = 0; lastMove = Date.now(); }
  }

  // Vitesse : celle du GPS, sinon calculée entre deux positions
  const t = p.timestamp;
  let v = (typeof speed === "number" && !isNaN(speed)) ? speed : null;
  if (v === null && lastPos) {
    const dt = (t - lastPos.t) / 1000;
    const moved = distanceM(lastPos.la, lastPos.lo, la, lo);
    v = (dt > 0.5 && moved > accuracy * 0.5) ? moved / dt : 0;
  }
  lastPos = { la, lo, t: Date.now() };
  if (v !== null) smooth = 0.6 * smooth + 0.4 * Math.min(v, 3);
  detail.textContent = "Précision du GPS : environ " + Math.round(accuracy) + " m";
  apply();
}

function tick() {
  if (lastPos && Date.now() - lastPos.t > 4000) smooth *= 0.7; // sans nouvelle position, la vitesse retombe
  apply();
}

function apply() {
  if (!fixed) return;
  ZONES.forEach(z => { if (z !== active && !z.audio.paused) z.audio.pause(); });

  if (!active) {
    voice.classList.remove("on");
    btn.textContent = "Hors zone";
    let n = null;
    ZONES.forEach(z => { if (!n || z.d - z.radius < n.d - n.radius) n = z; });
    msg.textContent = "Prochaine zone : « " + n.name + " », à " + fmt(Math.max(0, n.d - n.radius)) + ".";
    return;
  }
  const a = active.audio, now = Date.now();
  if (finished.has(active.id)) {
    voice.classList.remove("on");
    btn.textContent = "Terminé";
    msg.textContent = "« " + active.name + " » est terminée. Avancez vers la zone suivante.";
    return;
  }
  if (smooth >= MIN_SPEED) lastMove = now;
  const walking = !WALK_CONTROLS || now - lastMove < STOP_DELAY;
  if (walking) {
    if (WALK_CONTROLS) {
      const rate = Math.min(MAX_RATE, Math.max(MIN_RATE, smooth / REF_SPEED));
      a.defaultPlaybackRate = rate; a.playbackRate = rate;
    }
    btn.textContent = WALK_CONTROLS ? "En marche" : "À l’écoute";
    msg.textContent = "« " + active.name + " »" + (WALK_CONTROLS ? " : la voix suit votre pas." : ".");
    if (a.paused) a.play().catch(() => { msg.textContent = "Touchez l’écran pour autoriser le son."; });
    voice.classList.add("on");
  } else {
    btn.textContent = "À l’arrêt";
    msg.textContent = "« " + active.name + " » : marchez pour entendre la voix.";
    if (!a.paused) a.pause();
    voice.classList.remove("on");
  }
}

function onErr(e) {
  btn.textContent = "Indisponible";
  msg.textContent = e.code === 1
    ? "La position est refusée. Autorisez-la dans les réglages du navigateur, puis rechargez la page."
    : "Position introuvable. Sortez à découvert et rechargez la page.";
  detail.textContent = "";
}
</script>
</body>
</html>
