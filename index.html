<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="dark">
<title>La voix de la forêt</title>
<style>
  :root {
    --moss: #14201a;
    --moss-2: #1d2e24;
    --lichen: #b5c48f;
    --fog: #e7ebdf;
    --bark: #8a735c;
    box-sizing: border-box;
    padding-top: env(safe-area-inset-top, 0px);
    padding-bottom: env(safe-area-inset-bottom, 0px);
  }
  *, *::before, *::after { box-sizing: inherit; }
  html, body { height: 100%; margin: 0; }
  body {
    background: radial-gradient(ellipse at 50% 38%, var(--moss-2), var(--moss) 70%);
    color: var(--fog);
    font-family: "Iowan Old Style", "Palatino Linotype", Palatino, Georgia, serif;
    line-height: 1.6;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    text-align: center;
    padding: 1.5rem;
  }
  main { width: 100%; max-width: 26rem; }
  h1 {
    font-weight: 400;
    font-size: clamp(2.2rem, 10vw, 3.2rem);
    line-height: 1.05;
    letter-spacing: -0.01em;
    margin: 0 0 2.5rem;
  }
  .voice { position: relative; width: 15rem; height: 15rem; margin: 0 auto 2rem; }
  .voice i {
    position: absolute; inset: 0; border-radius: 50%;
    border: 1px solid var(--lichen); opacity: .0;
  }
  .voice.on i { animation: ring 3.6s ease-out infinite; }
  .voice.on i:nth-child(2) { animation-delay: 1.2s; }
  .voice.on i:nth-child(3) { animation-delay: 2.4s; }
  @keyframes ring { from { transform: scale(.45); opacity: .7; } to { transform: scale(1.35); opacity: 0; } }
  button {
    position: absolute; inset: 1.6rem; padding: 0 1.3rem; line-height: 1.3;
    width: auto; height: auto;
    border-radius: 50%;
    border: 1px solid var(--lichen);
    background: transparent; color: var(--fog);
    font: inherit; font-size: 1rem; cursor: pointer;
  }
  button:hover:not(:disabled) { background: rgba(181,196,143,.12); }
  button:focus-visible { outline: 2px solid var(--lichen); outline-offset: 4px; }
  button:disabled { border-color: var(--bark); color: var(--bark); cursor: default; }
  #msg { font-size: 1.15rem; margin: 0 0 .5rem; min-height: 3.4em; }
  #detail { font-size: .95rem; color: var(--bark); margin: 0; min-height: 1.6em; }
  @media (prefers-reduced-motion: reduce) { .voice.on i { animation: none; opacity: .35; } }
</style>
</head>
<body>
<main>
  <h1>La voix de la forêt</h1>
  <div class="voice" id="voice"><i></i><i></i><i></i>
    <button id="btn" type="button">Commencer à écouter</button>
  </div>
  <p id="msg" aria-live="polite">Touchez le bouton pour activer votre position. Parcourez les chemins pour entendre la suite.</p>
  <p id="detail"></p>
</main>

<script>
// ---- Réglages ----
// Chaque zone : un point GPS, un rayon (m) et un fichier son. Le son se lance à l'entrée dans la zone.
// Si des zones se chevauchent : le son de la zone qu'on vient d'entrer prend la place du précédent.
const ZONES = [
  { id: "fv1", name: "Forêt ventriloque 1", lat: 46.279639, lon: 7.084250, radius: 70, src: "foret-ventriloque1.mp3" }, // 46°16'46.7"N 7°05'03.3"E
  { id: "fv2", name: "Forêt ventriloque 2", lat: 46.279083, lon: 7.082361, radius: 70, src: "foret-ventriloque2.mp3" }, // 46°16'44.7"N 7°04'56.5"E
  { id: "fv3", name: "Forêt ventriloque 3", lat: 46.279667, lon: 7.081611, radius: 70, src: "foret-ventriloque3.mp3" }  // 46°16'46.8"N 7°04'53.8"E
];
const STILL_PAUSE = true;     // true : le son s'arrête si la personne ne bouge plus
const CHECK_INTERVAL = 20000; // ms : toutes les 20 s, on regarde si la personne a avancé
const MIN_MOVE = 5;           // m : déplacement minimal entre deux contrôles pour que la lecture continue
const BLIND_LIMIT = 40000;    // ms : sans aucune position GPS pendant ce délai, la lecture s'arrête
const EXIT_MARGIN = 10;       // m : marge à la sortie d'une zone, pour éviter les coupures dues au GPS
// -------------------

const $ = id => document.getElementById(id);
const btn = $("btn"), msg = $("msg"), detail = $("detail"), voice = $("voice");
let started = false, active = null, fixed = false;
let pos = null, anchor = null, moving = true, lastCheck = 0;
const finished = new Set();

// Un seul lecteur, débloqué au premier tap : c'est ce qui fonctionne le mieux sur iPhone
const audio = new Audio();
audio.preload = "auto";
const SILENCE = "data:audio/wav;base64,UklGRiQAAABXQVZFZm10IBAAAAABAAEAESsAACJWAAACABAAZGF0YQAAAAA=";
let broken = false;
const isZoneSound = () => active && !audio.src.startsWith("data:");
audio.addEventListener("ended", () => { if (isZoneSound()) { finished.add(active.id); apply(); } });
audio.addEventListener("error", () => { if (isZoneSound()) { broken = true; apply(); } });
document.addEventListener("click", () => { if (started) apply(); }); // un toucher relance le son s'il a été bloqué

function distanceM(lat1, lon1, lat2, lon2) {
  const R = 6371000, rad = Math.PI / 180;
  const dLat = (lat2 - lat1) * rad, dLon = (lon2 - lon1) * rad;
  const a = Math.sin(dLat / 2) ** 2 +
            Math.cos(lat1 * rad) * Math.cos(lat2 * rad) * Math.sin(dLon / 2) ** 2;
  return 2 * R * Math.asin(Math.sqrt(a));
}
const fmt = d => d >= 1000 ? (d / 1000).toFixed(1).replace(".", ",") + " km" : Math.round(d) + " m";

btn.addEventListener("click", () => {
  if (started) return;
  if (!("geolocation" in navigator)) { msg.textContent = "Ce navigateur ne permet pas d’utiliser la position."; return; }
  started = true;
  btn.disabled = true;
  btn.textContent = "…";
  msg.textContent = "Recherche de votre position…";
  // Ce premier geste débloque la lecture automatique des sons
  audio.src = SILENCE;
  audio.play().then(() => audio.pause()).catch(() => {});
  try { navigator.wakeLock && navigator.wakeLock.request("screen").catch(() => {}); } catch (e) {}
  navigator.geolocation.watchPosition(onPos, onErr, { enableHighAccuracy: true, maximumAge: 2000, timeout: 30000 });
  setInterval(tick, 1000);
});

// Repart de la position actuelle : la lecture est autorisée pendant les 20 s suivantes
function startMotion() {
  anchor = { la: pos.la, lo: pos.lo, t: pos.t };
  moving = true;
  lastCheck = Date.now();
}

function onPos(p) {
  const { latitude: la, longitude: lo, accuracy } = p.coords;
  fixed = true;
  pos = { la, lo, t: Date.now() };
  ZONES.forEach(z => {
    z.d = distanceM(la, lo, z.lat, z.lon);
    const was = !!z.inside;                                   // marge à la sortie : évite les va-et-vient dus au GPS
    z.inside = z.d <= z.radius || (was && z.d <= z.radius + EXIT_MARGIN);
    z.entered = z.inside && !was;
  });

  // Choix de la zone : celle qu'on vient d'entrer, sinon celle en cours, sinon la plus proche parmi celles où l'on se trouve
  const nearest = list => list.reduce((m, z) => (!m || z.d < m.d) ? z : m, null);
  let best = nearest(ZONES.filter(z => z.entered));
  if (!best && active && active.inside) best = active;
  if (!best) best = nearest(ZONES.filter(z => z.inside));
  if (best !== active) {
    audio.pause();
    active = best;
    broken = false;
    if (active) { finished.delete(active.id); audio.src = active.src; startMotion(); }
  }

  if (!anchor) startMotion();
  else if (active && !moving && distanceM(anchor.la, anchor.lo, la, lo) >= MIN_MOVE) startMotion(); // la personne repart

  detail.textContent = "Précision du GPS : environ " + Math.round(accuracy) + " m";
  apply();
}

// Toutes les 20 s : la personne a-t-elle avancé d'au moins 5 m depuis le dernier contrôle ?
function doCheck() {
  const now = Date.now();
  lastCheck = now;
  if (!pos || !anchor || !active) return;
  if (pos.t === anchor.t || now - pos.t > CHECK_INTERVAL) {   // pas de position récente : le GPS a besoin de temps
    if (now - pos.t > BLIND_LIMIT) moving = false;
    return;
  }
  if (distanceM(anchor.la, anchor.lo, pos.la, pos.lo) >= MIN_MOVE) {
    moving = true;
    anchor = { la: pos.la, lo: pos.lo, t: pos.t };
  } else {
    moving = false;
  }
}

function tick() {
  if (fixed && Date.now() - lastCheck >= CHECK_INTERVAL) doCheck();
  apply();
}

function apply() {
  if (!fixed) return;
  if (!active && !audio.paused) audio.pause();

  if (!active) {
    voice.classList.remove("on");
    btn.textContent = "Hors zone";
    let n = null;
    ZONES.forEach(z => { if (!n || z.d - z.radius < n.d - n.radius) n = z; });
    msg.textContent = "Prochaine zone : « " + n.name + " », à " + fmt(Math.max(0, n.d - n.radius)) + ".";
    return;
  }
  if (broken) {
    voice.classList.remove("on");
    btn.textContent = "Erreur";
    msg.textContent = "Fichier son introuvable ou illisible : " + active.src;
    return;
  }
  if (finished.has(active.id)) {
    voice.classList.remove("on");
    btn.textContent = "Terminé";
    msg.textContent = "« " + active.name + " » est terminée. Avancez vers la zone suivante.";
    return;
  }
  if (!STILL_PAUSE || moving) {
    btn.textContent = "À l’écoute";
    msg.textContent = "« " + active.name + " » : continuez d’avancer pour entendre la suite.";
    if (audio.paused) audio.play().catch(e => {
      if (e.name === "NotAllowedError") msg.textContent = "Touchez l’écran pour autoriser le son.";
      else if (e.name !== "AbortError") msg.textContent = "Lecture impossible (" + e.name + ") : " + active.src;
    });
    voice.classList.add("on");
  } else {
    btn.textContent = "En pause";
    msg.textContent = "« " + active.name + " » : avancez pour entendre la suite.";
    if (!audio.paused) audio.pause();
    voice.classList.remove("on");
  }
}

function onErr(e) {
  if (e.code !== 1 && fixed) return; // perte passagère du signal : on garde la dernière position
  btn.textContent = "Indisponible";
  msg.textContent = e.code === 1
    ? "La position est refusée. Autorisez-la dans les réglages du navigateur, puis rechargez la page."
    : "Position introuvable. Sortez à découvert et rechargez la page.";
  detail.textContent = "";
}
</script>
</body>
</html>
